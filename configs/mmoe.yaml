# MMoE：共享专家 + 每任务门控。

data_config: configs/data.yaml
tasks: [click, long_view, like, follow, comment]
embedding_dim: 32
optimizer: adam
lr: 0.001
batch_size: 2048
epochs: 1                    # 固定轮数、报最后一步，不挑 checkpoint（理由见 trainer.py）。
                             # 从 5 改成 1 的实测依据（1K，seed 42，选择全程只用 valid，
                             # test 一次未碰）。原设置 wd=0 / 5 轮时 valid AUC 从第 1 轮起
                             # 单调下滑：0.7287 → 0.7174 → 0.7040 → 0.6902 → 0.6776。
                             # 轮**内**每 250 步评估才看清：峰值在 step 250（第 0.11 轮），
                             # 之后整轮是平的 —— 可泛化的信号在 25 万样本内就学完了。
                             #
                             # 稀疏任务更极端。is_follow（4,922 个训练正样本）在 wd=0 下
                             # 峰值 0.8269 出现在第 0.67 轮，第 3 轮末只剩 0.7354 —— 掉 0.0915。
                             # 若按原设置报第 3 轮，follow 的 Single-Task 基线会低 0.09 AUC，
                             # 而它是 §27.1 里 ΔAUC 的分母：分母被压低会让四个 MTL 模型集体
                             # 显得有正迁移。这是方向性的假结论，不是噪声。
                             #
                             # 收敛证据（wd=1e-5，1 轮 = 2,196 步）：
                             #   is_click  从 step  750 起平在 0.732~0.734
                             #   is_follow 从 step  549 起平在 0.826~0.832
                             # 所以 1 轮不是训练不足，是已经收敛。
                             #
                             # 若将来曲线显示 1 轮不合适，必须**四个模型一起改**，
                             # 不能只调某一个，否则 ΔAUC 里会混进训练量的差异。
dropout: 0.0                 # 显式写 0：实测无效。塔只有 12 万参数，而过拟合在
                             # 2,870 万参数的历史 embedding 上 —— dropout 打错了地方
                             # （is_click 1 轮末 0.72734 vs 基准 0.72780）。留着这一行是
                             # 为了下次不再试同一条死路。
weight_decay: 1.0e-5         # 排序侧过拟合在**历史 embedding**（897,505 行 x 32 = 2,870 万
                             # 参数，占总参数 77%），不在目标 ID（620 万）也不在塔（12 万）。
                             # 三条否证（is_click，各 1 轮，valid 轮末 AUC，基准 0.72780）：
                             #   dropout=0.2（打塔）        0.72734  无效
                             #   id_dropout=0.3（打目标ID） 0.72864  无效
                             #   去掉整条目标 ID 通道        0.72817  无效，该通道贡献≈0
                             #   lr=3e-4                    0.72503  更差
                             # weight decay 是唯一作用在**全部** embedding 行上的手段。
                             #
                             # 取 1e-5 而不是更大：两个极端任务在 epochs=1 上的落差
                             # （相对各任务已观测最好值 click 0.73798 / follow 0.84041）——
                             #        is_click   is_follow   最大落差
                             #   0     0.72780    0.8225      0.0179
                             #   1e-5  0.73372    0.8262      0.0142   <- 选它
                             #   3e-5  ~0.734     0.8186      0.0218
                             #   1e-4  0.73558    0.8025      0.0379
                             # 只看 click 时 1e-4 最好，但它在 follow 上掉 0.024；
                             # 1e-5 在两个极端任务上都不差，最大落差最小。
                             #
                             # 另一个好处：weight decay **不改变参数量**，而降 embedding_dim
                             # 那类做法会改，会污染 §25.1 的 parameter budget 对比。
                             # 作用于全部参数（dense 只有 12 万，分组的收益不值得多一个变量）。
eval_every_steps: 500        # 每 500 步在 valid 上记一次曲线（**只记录，不挑 checkpoint**）。
                             # 按轮记不够：wd=0 时按轮看是"第 1 轮然后下滑"，按 250 步看才
                             # 发现峰值在第 0.11 轮。epochs=1 时按轮记只有一个点，等于没有曲线。
seeds: [42, 43, 44]        # 最终实验必须 3 seeds，报告 mean ± std

n_experts: 8
expert_hidden: [256, 128]
tower_hidden: [64]

# 输入编码器口径。四个模型**必须逐字相同** —— §27.1 的 ΔAUC 要求除共享机制外无差异，
# 输入拼法各写一套就会把差异算进 ΔAUC。trainer 会把这份口径的指纹写进 results，
# 报告阶段断言四个模型的指纹一致；不一致直接报错，不出表。
input:
  author_dim: 16               # 作者 embedding 维度（词表 158,253 行）
  tag_dim: 8                   # 标签 embedding 维度（词表 60 行）
  cat_dim: 8                   # 用户静态类别字段每个的 embedding 上限
  max_hist: 50
  mask_oov_in_history: true    # 历史池化时 PAD 与 OOV 一同 mask（口径与双塔一致）
  pair_features: true          # 接入 user x author 偏好特征（plan §8.4，15 列）。
                               # 加它的理由：Single-Task 在 valid 上 is_follow 的 GAUC 只有
                               # 0.49014、is_comment 0.50537 —— 用户内部排序与随机无异，
                               # 因为模型没有任何 user x author 交互特征。实测单特征
                               # ua_imp_7d 的 GAUC 就有 0.53784 / 0.53764，打赢整个模型。
                               # 关掉它可做消融；关掉会改输入指纹，所以不会被静默混用。
