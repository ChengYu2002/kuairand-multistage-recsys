# Selective Sharing：可控的 shared / task-specific 表示（P0）。

data_config: configs/data.yaml
tasks: [click, long_view, like, follow, comment]
embedding_dim: 32
optimizer: adam
lr: 0.001
batch_size: 2048
epochs: 5
seeds: [42, 43, 44]        # 最终实验必须 3 seeds，报告 mean ± std

sharing_mode: selective        # full_shared | selective | ple_style
shared_dim: 96
task_specific_dim: 32
expert_hidden: [256, 128]
tower_hidden: [64]
match_parameter_budget: true   # 与 MMoE / PLE 尽量保持参数可比
